<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Snake Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        .score-board {
            display: flex;
            gap: 30px;
            font-size: 1.25rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .score-box {
            background: #1e293b;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .score-box span {
            color: #4ade80;
        }

        #game-container {
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #334155;
        }

        canvas {
            background-color: #020617;
            display: block;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        .overlay h2 {
            font-size: 2rem;
            color: #ef4444;
            margin-bottom: 10px;
        }

        .overlay p {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.4);
        }

        .btn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .instructions {
            margin-top: 20px;
            color: #64748b;
            font-size: 0.9rem;
            text-align: center;
        }

        .instructions key {
            background: #1e293b;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #475569;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <h1>🐍 Snake Game</h1>

    <div class="score-board">
        <div class="score-box">Score: <span id="score">0</span></div>
        <div class="score-box">High Score: <span id="high-score">0</span></div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="overlay" class="overlay">
            <h2 id="overlay-title">Press Start to Play</h2>
            <p id="overlay-subtitle">Use Arrow keys or WASD to navigate</p>
            <button id="start-btn" class="btn">Start Game</button>
        </div>
    </div>

    <div class="instructions">
        Use <key>W</key><key>A</key><key>S</key><key>D</key> or <key>↑</key><key>←</key><key>↓</key><key>→</key> to control the snake. Press <key>Space</key> to pause.
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('high-score');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlaySubtitle = document.getElementById('overlay-subtitle');
        const startBtn = document.getElementById('start-btn');

        const GRID_SIZE = 20;
        const TILE_COUNT = canvas.width / GRID_SIZE;

        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = GRID_SIZE;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameInterval = null;
        let isPaused = false;
        let gameRunning = false;
        let nextDirection = { dx: GRID_SIZE, dy: 0 };

        highScoreEl.textContent = highScore;

        function initGame() {
            snake = [
                { x: 5 * GRID_SIZE, y: 10 * GRID_SIZE },
                { x: 4 * GRID_SIZE, y: 10 * GRID_SIZE },
                { x: 3 * GRID_SIZE, y: 10 * GRID_SIZE }
            ];
            score = 0;
            dx = GRID_SIZE;
            dy = 0;
            nextDirection = { dx: GRID_SIZE, dy: 0 };
            scoreEl.textContent = score;
            spawnFood();
        }

        function spawnFood() {
            let validPosition = false;
            while (!validPosition) {
                food.x = Math.floor(Math.random() * TILE_COUNT) * GRID_SIZE;
                food.y = Math.floor(Math.random() * TILE_COUNT) * GRID_SIZE;
                validPosition = !snake.some(segment => segment.x === food.x && segment.y === food.y);
            }
        }

        function gameLoop() {
            if (isPaused) return;

            dx = nextDirection.dx;
            dy = nextDirection.dy;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Wall Collision Check
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                gameOver();
                return;
            }

            // Self Collision Check
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            // Food Collision Check
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                if (score > highScore) {
                    highScore = score;
                    highScoreEl.textContent = highScore;
                    localStorage.setItem('snakeHighScore', highScore);
                }
                spawnFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            // Clear Background
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Grid Lines (Subtle)
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // Draw Food
            ctx.fillStyle = '#ef4444';
            ctx.shadowColor = '#ef4444';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(food.x + GRID_SIZE / 2, food.y + GRID_SIZE / 2, GRID_SIZE / 2 - 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Draw Snake
            snake.forEach((segment, index) => {
                if (index === 0) {
                    ctx.fillStyle = '#4ade80'; // Head
                    ctx.shadowColor = '#4ade80';
                    ctx.shadowBlur = 6;
                } else {
                    ctx.fillStyle = '#22c55e'; // Body
                    ctx.shadowBlur = 0;
                }

                ctx.beginPath();
                ctx.roundRect(segment.x + 1, segment.y + 1, GRID_SIZE - 2, GRID_SIZE - 2, 4);
                ctx.fill();
            });
            ctx.shadowBlur = 0;
        }

        function startGame() {
            initGame();
            overlay.style.display = 'none';
            gameRunning = true;
            isPaused = false;
            clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 100);
            draw();
        }

        function gameOver() {
            clearInterval(gameInterval);
            gameRunning = false;
            overlayTitle.textContent = "Game Over!";
            overlayTitle.style.color = "#ef4444";
            overlaySubtitle.textContent = `Final Score: ${score}`;
            startBtn.textContent = "Play Again";
            overlay.style.display = 'flex';
        }

        function togglePause() {
            if (!gameRunning) return;
            isPaused = !isPaused;
            if (isPaused) {
                overlayTitle.textContent = "Paused";
                overlayTitle.style.color = "#38bdf8";
                overlaySubtitle.textContent = "Press Space or click Resume";
                startBtn.textContent = "Resume";
                overlay.style.display = 'flex';
            } else {
                overlay.style.display = 'none';
            }
        }

        document.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                e.preventDefault();
            }

            if (e.key === ' ' || e.code === 'Space') {
                togglePause();
                return;
            }

            if (!gameRunning || isPaused) return;

            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (dy === 0) nextDirection = { dx: 0, dy: -GRID_SIZE };
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (dy === 0) nextDirection = { dx: 0, dy: GRID_SIZE };
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (dx === 0) nextDirection = { dx: -GRID_SIZE, dy: 0 };
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (dx === 0) nextDirection = { dx: GRID_SIZE, dy: 0 };
                    break;
            }
        });

        startBtn.addEventListener('click', () => {
            if (isPaused) {
                togglePause();
            } else {
                startGame();
            }
        });
    </script>
</body>
</html>
